# Cloudflare keeps connecting to 9900; the Python application listens on 9901.
server {
    listen 127.0.0.1:9900;
    server_name _;
    server_tokens off;
    client_max_body_size 24m;
    root /home/ubuntu/projects/Boufbowl/boufbowl_swf/.local/website/dist;
    index index.html;
    autoindex off;
    access_log /var/log/nginx/boufbowl-access.log;
    error_log /var/log/nginx/boufbowl-error.log;

    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types text/css text/javascript application/javascript application/wasm
                 application/xml image/svg+xml model/vnd.collada+xml;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/wasm
               application/xml image/svg+xml model/vnd.collada+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;

    # Public pages/assets are generated by Bun and served directly from disk.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=2592000";
    }
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/(?:robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location ~ \.(?:html|json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    # Bun filenames change when their contents change.
    location ^~ /js/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /downloads/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /__mock_trace {
        return 204;
    }
    location = /website-tracking.html {
        absolute_redirect off;
        add_header Cache-Control "no-cache";
        return 308 /website-activity.html$is_args$args;
    }
    location = /website-analytics.html {
        absolute_redirect off;
        add_header Cache-Control "no-cache";
        return 308 /website-activity.html$is_args$args;
    }
    # Long polling and uploads must not be delayed by response buffering.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:9901;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        brotli off;
    }
}
