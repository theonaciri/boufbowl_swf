<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Isolated animation rate study</title>
<style>body{margin:0;background:#17231f;color:#dfece5;font:14px system-ui}#game{width:640px;height:375px}#status{padding:8px}button{margin:8px}</style>
<div id="status">Diagnostic worktree — no production connection</div><div id="game"></div><button onclick="runMatrix()">Run timing matrix</button><pre id="out"></pre>
<script src="/vendor/ruffle/ruffle.js"></script><script>
const query=new URLSearchParams(location.search);let player;const result={environment:{userAgent:navigator.userAgent,hardwareConcurrency:navigator.hardwareConcurrency,dpr:devicePixelRatio,runtimePath:query.get('runtime')||'ruffle',productionPolicy:query.has('applied'),target:Number(query.get('fps')||0),visibility:document.visibilityState,mode:query.has('replay')?'replay':query.has('forced')?'forced':query.has('bare')?'bare':'game-ui',ruffle:'0.8.0-nightly.2026.10.13'},samples:[]};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const call=(name,...args)=>player.ruffle().callExternalInterface(name,...args);
function percentile(a,p){return a.length?[...a].sort((a,b)=>a-b)[Math.min(a.length-1,Math.ceil(a.length*p)-1)]:null}
function summarize(a){return {count:a.length,medianMs:percentile(a,.5),p95Ms:percentile(a,.95),maxMs:a.length?Math.max(...a):null}}
async function ready(){for(let i=0;i<100;i++){try{if(call('studyPolicy'))return}catch{}await sleep(200)}throw Error('ExternalInterface not ready')}
async function load(){player=RufflePlayer.newest().createPlayer();document.getElementById('game').append(player);player.style.cssText='width:100%;height:100%';const config={url:'/client.swf',autoplay:'on',splashScreen:false,allowScriptAccess:true,quality:'low',unmuteOverlay:'hidden',parameters:{lang:'fr',server:'0',mock:query.has('replay')?'1':'0',scene3d:'1',clientRuntime:query.get('runtime')||'ruffle',webFps:query.has('applied')?(query.get('fps')||'30'):'30',studyProductionPolicy:query.has('applied')?'1':'0',studyBare:query.has('bare')?'1':'0'}};if(query.has('forced'))config.frameRate=Number(query.get('forced'));await player.ruffle().load(config);await ready();window.policy=call('studyPolicy');document.getElementById('status').textContent=JSON.stringify(window.policy);if(query.has('fps'))call('studySetRate',Number(query.get('fps')));}
async function sample(rate,ms=3000,repeat=0,untilEnd=false){call('studySetRate',rate);await sleep(350);const raf=[];let previous=0,active=true;function frame(t){if(previous)raf.push(t-previous);previous=t;if(active)requestAnimationFrame(frame)}requestAnimationFrame(frame);const start=performance.now();call('studyStart');if(untilEnd){let done=false;while(performance.now()-start<90000){await sleep(1000);const progress=await fetch('/progress?fps='+rate).then(r=>r.json());if(progress.done){done=true;result.replayEvents=progress.events;break}}if(!done)throw Error('Replay did not finish within 90 seconds')}else await sleep(ms);const stats=call('studyStop');active=false;const elapsed=performance.now()-start;const item={requested:rate,repeat,wallMs:elapsed,frameEventHz:stats.frames*1000/elapsed,uniqueTimerHz:(stats.frames-stats.duplicates)*1000/elapsed,rafHz:raf.length*1000/elapsed,intervals:summarize(stats.intervals),rafIntervals:summarize(raf),...stats};result.samples.push(item);document.getElementById('out').textContent=JSON.stringify(item,null,2);return item}
async function runMatrix(rates=[25,30,50,60,90,120,144,240],repeats=3,ms=3000){result.policy=call('studyPolicy');result.synthetic=call('studySynthetic');window.matrixStatus='running';for(let repeat=0;repeat<repeats;repeat++)for(const rate of (repeat%2?[...rates].reverse():rates)){await sample(rate,ms,repeat);await save()}window.matrixStatus='done';return result}
async function save(){await fetch('/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)})}
window.studyReady=load();
</script>
