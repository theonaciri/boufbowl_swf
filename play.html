  "@context": "https://schema.org",

}</script>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        background: #171717;
        color: #eee;
        font-family: sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100vh;
        height: 100dvh;
        background: #171717;
      }
      #game:fullscreen {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      ruffle-player {
        display: block;
        width: 100%;
        height: 100%;
      }
      #fullscreen {
        display: none;
        position: fixed;
        z-index: 2;
        top: max(0.75rem, env(safe-area-inset-top));
        right: max(0.75rem, env(safe-area-inset-right));
        border: 1px solid #777;
        border-radius: 999px;
        padding: 0.6rem 0.85rem;
        background: rgb(23 23 23 / 88%);
        color: #fff;
        font: inherit;
        touch-action: none;
        user-select: none;
        cursor: grab;
      }
      #fullscreen.is-dragging {
        cursor: grabbing;
      }
      @media (pointer: coarse) {
        #fullscreen:not([hidden]) {
          display: block;
        }
      }
      #game:fullscreen ~ #fullscreen {
        display: none;
      }
      #status {
        position: fixed;
        max-width: calc(100% - 2rem);
        text-align: center;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <button id="fullscreen" type="button" hidden aria-label="Passer en plein écran">⛶ Plein écran</button>
    <p id="status" role="status">Chargement de Boufbowl…</p>
    <script src="vendor/ruffle/ruffle.js"></script>
    <script>
      (async () => {
        const status = document.getElementById("status");
        const game = document.getElementById("game");
        const fullscreenButton = document.getElementById("fullscreen");
        let drag = null;
        let suppressClickUntil = 0;
        fullscreenButton.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          const rect = fullscreenButton.getBoundingClientRect();
          drag = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            left: rect.left,
            top: rect.top,
            moved: false,
          };
          fullscreenButton.setPointerCapture(event.pointerId);
        });
        fullscreenButton.addEventListener("pointermove", (event) => {
          if (!drag || drag.pointerId !== event.pointerId) return;
          const dx = event.clientX - drag.startX;
          const dy = event.clientY - drag.startY;
          if (!drag.moved && Math.hypot(dx, dy) < 6) return;
          drag.moved = true;
          fullscreenButton.classList.add("is-dragging");
          fullscreenButton.style.left = `${Math.max(0, Math.min(innerWidth - fullscreenButton.offsetWidth, drag.left + dx))}px`;
          fullscreenButton.style.top = `${Math.max(0, Math.min(innerHeight - fullscreenButton.offsetHeight, drag.top + dy))}px`;
          fullscreenButton.style.right = "auto";
        });
        const finishDrag = (event) => {
          if (!drag || drag.pointerId !== event.pointerId) return;
          if (drag.moved) suppressClickUntil = Date.now() + 400;
          drag = null;
          fullscreenButton.classList.remove("is-dragging");
        };
        fullscreenButton.addEventListener("pointerup", finishDrag);
        fullscreenButton.addEventListener("pointercancel", finishDrag);
        fullscreenButton.addEventListener("click", async (event) => {
          if (Date.now() < suppressClickUntil) {
            event.preventDefault();
            return;
          }
          try {
            if (game.requestFullscreen) {
              await game.requestFullscreen();
            } else if (document.documentElement.requestFullscreen) {
              await document.documentElement.requestFullscreen();
            } else {
              status.hidden = false;
              status.textContent =
                "Le plein écran n’est pas disponible dans ce navigateur. Sur iPhone, ouvrez cette page depuis l’écran d’accueil pour masquer les barres du navigateur.";
            }
          } catch (error) {
            status.hidden = false;
            status.textContent =
              "Le plein écran n’a pas pu être activé. Sur iPhone, ajoutez cette page à l’écran d’accueil pour une expérience sans barres du navigateur.";
            console.error(error);
          }
        });
        try {
          if (!window.RufflePlayer) {
            throw new Error(
              "Ruffle is missing. Install its self-hosted release in vendor/ruffle/.",
            );
          }
          const response = await fetch("api/client", { cache: "no-store" });
          if (!response.ok) {
            throw new Error(
              "Restart the updated backend server, then reload this page.",
            );
          }
          const client = await response.json();
          const player = window.RufflePlayer.newest().createPlayer();
          game.appendChild(player);
          await player.load({
            url: client.url,
            backgroundExecutionMode: "none",
            scale: "showAll",
            forceScale: true,
            parameters: {
              lang: "fr",
              tuto: "0",
              mock: "0",
              server: "1",
              scene3d: "1",
              backend: location.origin,
              clientPlatform: "browser",
              clientRuntime: "ruffle",
              clientOS:
                navigator.userAgentData?.platform || navigator.platform || "",
              clientBrowser: (() => {
                for (const [token, name] of [
                  ["Edg", "Edge"],
                  ["OPR", "Opera"],
                  ["Firefox", "Firefox"],
                  ["Chrome", "Chrome"],
                  ["Version", "Safari"],
                ]) {
                  const match = navigator.userAgent.match(
                    new RegExp(token + "/([\\d.]+)"),
                  );
                  if (match) return name + " " + match[1];
                }
                return "unknown";
              })(),
            },
          });
          status.hidden = true;
          fullscreenButton.hidden = false;
        } catch (error) {
          status.textContent = "Unable to load Boufbowl: " + error.message;
          console.error(error);
        }
      })();
    </script>
  </body>
