    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        background: #171717;
        color: #eee;
        font-family: sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100vh;
        height: 100dvh;
        background: #171717;
      }
      #game:fullscreen {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      ruffle-player {
        display: block;
        width: 100%;
        height: 100%;
      }
      #fullscreen {
        display: none;
        position: fixed;
        z-index: 2;
        top: max(0.75rem, env(safe-area-inset-top));
        right: max(0.75rem, env(safe-area-inset-right));
        border: 1px solid #777;
        border-radius: 999px;
        padding: 0.6rem 0.85rem;
        background: rgb(23 23 23 / 88%);
        color: #fff;
        font: inherit;
        touch-action: none;
        user-select: none;
        cursor: grab;
      }
      #fullscreen.is-dragging {
        cursor: grabbing;
      }
      @media (pointer: coarse) {
        #fullscreen:not([hidden]) {
          display: block;
        }
      }
      #game:fullscreen ~ #fullscreen {
        display: none;
      }
      :fullscreen #fullscreen { display: none; }
      #status {
        position: fixed;
        max-width: calc(100% - 2rem);
        text-align: center;
        padding: 1rem;
      }
      #display-options {
        position: fixed;
        z-index: 3;
        right: max(0.5rem, env(safe-area-inset-right));
        bottom: max(0.5rem, env(safe-area-inset-bottom));
        border: 1px solid #777;
        border-radius: 6px;
        background: rgb(23 23 23 / 94%);
        padding: 0.45rem 0.6rem;
        font-size: 12px;
      }
      #display-options summary { cursor: pointer; }
      #display-options label { display: block; margin-top: 0.6rem; }
      #display-options select { margin-left: 0.5rem; font: inherit; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <button id="fullscreen" type="button" hidden aria-label="Passer en plein écran">⛶ Plein écran</button>
    <details id="display-options" hidden>
      <summary>Affichage</summary>
      <label>Qualité <select id="web-quality" aria-label="Qualité du rendu">
        <option value="balanced">Équilibré · 30 FPS</option>
        <option value="quality">Élevée · 60 FPS</option>
        <option value="performance">Performance · 25 FPS</option>
      </select></label>
    </details>
    <p id="status" role="status">Chargement de Boufbowl…</p>
    <script src="vendor/ruffle/ruffle.js"></script>
    <script type="module" src="web-player.js"></script>
  </body>
