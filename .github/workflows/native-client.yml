name: Native client validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: [self-hosted, linux, boufbowl-air]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build shared client
        run: bun run build:game > native-build.log 2>&1
      - name: Verify both application roots in licensed native AIR
        run: python3 -m tools.verify_client --area native
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-client-evidence
          include-hidden-files: true
          path: |
            native-build.log
            .local/verification/native/
            .local/shared-client/*.json
            .local/shared-client/*.log
            .local/client-probes/*/compile.log
          retention-days: 14
